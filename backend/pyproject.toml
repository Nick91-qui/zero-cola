[project]
name = "cola-zero-backend"
version = "0.1.0"
description = "Backend foundation for COLA-ZERO"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.137.2",
  "uvicorn[standard]==0.49.0",
  "sqlalchemy==2.0.51",
  "alembic==1.18.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "pydantic[email]==2.13.4",
  "psycopg[binary]==3.3.4",
  "pyjwt==2.13.0",
  "bcrypt==4.1.3",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.9.0",
  "reportlab>=4.1.0",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.18"
]

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
