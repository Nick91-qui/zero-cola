services:
  postgres:
    image: postgres:16
    container_name: cola_zero_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: colazero
      POSTGRES_USER: colazero
      POSTGRES_PASSWORD: colazero
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    container_name: cola_zero_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg://colazero:colazero@postgres:5432/colazero
      SECRET_KEY: "dev-secret-key-change-in-production"
    volumes:
      - ./backend:/app:Z
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: cola_zero_frontend
    # Prefer Turbopack; native bindings install for linux/glibc via bookworm + npm ci.
    command: npm run dev -- --hostname 0.0.0.0
    depends_on:
      - backend
    environment:
      BACKEND_BASE_URL: http://backend:8000
      # Ensure Next binds correctly inside the container network namespace.
      HOSTNAME: 0.0.0.0
      WATCHPACK_POLLING: "true"
    volumes:
      # Hot reload from host sources…
      - ./frontend:/app:Z
      # …but keep Linux-native node_modules inside the container (not the host copy).
      - frontend-node-modules:/app/node_modules
    ports:
      - "3000:3000"

volumes:
  db-data:
  frontend-node-modules:
